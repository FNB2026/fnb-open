{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "FNB Protocol Object Exchange",
    "version": "1.0.0-preview.1",
    "description": "RFC-0004 narrow HTTP binding. Contract preview only; not a private FNB Alpha API. No product service or reference implementation is supplied.",
    "license": {
      "name": "Apache-2.0",
      "identifier": "Apache-2.0"
    }
  },
  "externalDocs": {
    "description": "Accepted RFC-0004 (immutable merge commit)",
    "url": "https://github.com/FNB2026/fnb-open/blob/81a71b1aae3747b84ccb73785b70bed78146f23a/rfcs/0004-protocol-object-exchange.md"
  },
  "x-fnb-transport-version": "1.0",
  "x-fnb-protocol-release": "v0.1.0-preview.1",
  "x-fnb-publication": {
    "release_tag": "object-exchange-v1.0.0-preview.1",
    "manifest": "artifact-digests.json",
    "state": "unpublished-until-tagged",
    "policy": "No published normative bytes may be replaced in place. This declaration and a digest file alone do not establish publication."
  },
  "x-fnb-protocol-schemas": [
    {
      "schema": "https://raw.githubusercontent.com/FNB2026/fnb-open/v0.1.0-preview.1/specs/v0.1/actor.schema.json",
      "identity_field": "actor_id"
    },
    {
