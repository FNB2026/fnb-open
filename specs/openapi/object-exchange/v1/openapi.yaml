      "identity_field": "inference_id"
    },
    {
      "schema": "https://raw.githubusercontent.com/FNB2026/fnb-open/v0.1.0-preview.1/specs/v0.1/asset.schema.json",
      "identity_field": "asset_id"
    },
    {
      "schema": "https://raw.githubusercontent.com/FNB2026/fnb-open/v0.1.0-preview.1/specs/v0.1/audit-tombstone.schema.json",
      "identity_field": "audit_id"
    },
    {
      "schema": "https://raw.githubusercontent.com/FNB2026/fnb-open/v0.1.0-preview.1/specs/v0.1/block-draft.schema.json",
