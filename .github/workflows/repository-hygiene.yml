name: Repository Hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-validation.lock
      - name: Validate synthetic JSON examples
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find examples -type f -name '*.json' -print0)
      - name: Validate protocol schemas and conformance fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --requirement tools/requirements-validation.lock
          python3 tools/validate-public-artifacts.py
      - name: Verify v0.1.0-preview.1 release bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fnb-conformance.py verify-release \
            --root . \
            --manifest specs/v0.1/releases/v0.1.0-preview.1/schema-digests.json
      - name: Verify generated protocol bindings are current
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-bindings.py --check
      - name: Verify generated fixture worlds are current and reproducible
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fnb-fixtures.py check
      - name: Verify the implementation conformance runner
        shell: bash
        run: |
          set -euo pipefail
          # A contract-conforming adapter must pass.
          python3 tools/fnb-conformance.py test-implementation \
            --adapter tests/conformance/adapters/contract-probe-adapter.py
          # A deliberately incorrect adapter must fail, otherwise the runner
          # has stopped testing anything.
          if python3 tools/fnb-conformance.py test-implementation \
               --adapter tests/conformance/adapters/faulty-adapter.py; then
            echo 'the implementation runner accepted a deliberately incorrect adapter' >&2
            exit 1
          fi
      - name: Guard the working tree against generator side effects
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
      - name: Require a changelog entry for schema changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" -- 'specs/v0.1/*.schema.json'; then
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" -- specs/v0.1/CHANGELOG.md; then
            echo 'Schema changes must update specs/v0.1/CHANGELOG.md.' >&2
            exit 1
          fi
      - name: Reject private material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$)'; then
            echo 'Tracked secret-bearing file type detected.' >&2
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY'; then
            echo 'Private key material detected.' >&2
            exit 1
          fi
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --accept 200,204,206,429 --timeout 20
            './**/*.md'
          fail: true

  typescript-bindings:
    name: Type-check generated protocol bindings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - name: Install the pinned TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix bindings/typescript --no-audit --no-fund
      - name: Type-check the generated declarations and the union expectations
        shell: bash
        run: |
          set -euo pipefail
          bindings/typescript/node_modules/.bin/tsc --noEmit \
            --project bindings/typescript/tsconfig.json
