name: Repository Hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-validation.lock
      - name: Validate synthetic JSON examples
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find examples -type f -name '*.json' -print0)
      - name: Validate protocol schemas and conformance fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --requirement tools/requirements-validation.lock
          python3 tools/validate-public-artifacts.py
      - name: Require a changelog entry for schema changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" -- 'specs/v0.1/*.schema.json'; then
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" -- specs/v0.1/CHANGELOG.md; then
            echo 'Schema changes must update specs/v0.1/CHANGELOG.md.' >&2
            exit 1
          fi
      - name: Reject private material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$)'; then
            echo 'Tracked secret-bearing file type detected.' >&2
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY'; then
            echo 'Private key material detected.' >&2
            exit 1
          fi
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --accept 200,204,206,429 --timeout 20
            './**/*.md'
          fail: true
